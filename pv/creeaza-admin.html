<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creare cont administrator — PV Euro Ecologic</title>
<style>
  :root{--bg:#10161c;--card:#18212a;--tx:#e8eef4;--mut:#9fb0be;--bd:#2a3742;--acc:#ff8a3d;--ok:#2e8b3c;--err:#c0392b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:26px;max-width:460px;width:100%}
  h1{font-size:20px;margin:0 0 6px}
  h1 span{color:var(--acc)}
  p.sub{color:var(--mut);font-size:14px;margin:0 0 20px;line-height:1.5}
  label{display:block;font-size:12px;color:var(--mut);margin:14px 0 5px;text-transform:uppercase;letter-spacing:.04em}
  input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--bd);background:#0e141a;color:var(--tx);font-size:15px}
  input:focus{outline:2px solid var(--acc);border-color:var(--acc)}
  button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:9px;background:var(--acc);color:#1a1006;
         font-weight:700;font-size:15px;cursor:pointer}
  button:disabled{opacity:.55;cursor:default}
  .msg{margin-top:16px;padding:12px;border-radius:9px;font-size:14px;line-height:1.5;display:none}
  .msg.ok{display:block;background:rgba(46,139,60,.15);border:1px solid var(--ok);color:#8fe3a0}
  .msg.err{display:block;background:rgba(192,57,43,.15);border:1px solid var(--err);color:#f0a79f}
  .hint{color:var(--mut);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<div class="card">
  <h1>Creare cont <span>administrator</span></h1>
  <p class="sub">Se folosește o singură dată, la instalare. După ce există primul cont, pagina nu mai are efect —
  serverul refuză orice altă încercare. Parola o alegi tu aici și merge direct la Supabase.</p>

  <label for="nume">Nume complet</label>
  <input id="nume" autocomplete="name" placeholder="ANITOIU OVIDIU">

  <label for="user">Nume de utilizator (cu asta te loghezi)</label>
  <input id="user" autocomplete="username" placeholder="ovidiu">
  <div class="hint">Doar litere mici, cifre, punct sau liniuță.</div>

  <label for="parola">Parolă</label>
  <input id="parola" type="password" autocomplete="new-password" placeholder="minim 8 caractere">

  <label for="parola2">Repetă parola</label>
  <input id="parola2" type="password" autocomplete="new-password">

  <button id="btn">Creează contul</button>
  <div id="msg" class="msg"></div>
</div>

<script>
const SUPABASE_URL = 'https://xrveoxmsdvryzyemmkqx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_P1TSfVqqbyr3L-elKVgopg_1FpIpkv4';
const btn = document.getElementById('btn');
const msg = document.getElementById('msg');
function arata(text, ok){ msg.className = 'msg ' + (ok ? 'ok' : 'err'); msg.innerHTML = text; }

btn.onclick = async () => {
  const full_name = document.getElementById('nume').value.trim();
  const username  = document.getElementById('user').value.trim().toLowerCase();
  const password  = document.getElementById('parola').value;
  const password2 = document.getElementById('parola2').value;

  if (!full_name || !username || !password) return arata('Completează toate câmpurile.', false);
  if (!/^[a-z0-9._-]+$/.test(username))     return arata('Numele de utilizator poate avea doar litere mici, cifre, punct sau liniuță.', false);
  if (password.length < 8)                  return arata('Parola trebuie să aibă cel puțin 8 caractere.', false);
  if (password !== password2)               return arata('Cele două parole nu sunt la fel.', false);

  btn.disabled = true; btn.textContent = 'Se creează…';
  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/admin-manage-users', {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'bootstrap_admin', username, password, full_name })
    });
    const p = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(p.error || 'Cerere eșuată');
    arata('Contul a fost creat. Intră în <a href="admin/" style="color:#8fe3a0">ecranul de administrare</a> cu utilizatorul <b>' + username + '</b> și parola ta.<br><br>Poți șterge acum acest fișier din depozitul de cod.', true);
    btn.textContent = 'Gata';
  } catch (e) {
    arata('Nu a mers: ' + e.message, false);
    btn.disabled = false; btn.textContent = 'Creează contul';
  }
};
</script>
</body>
</html>
