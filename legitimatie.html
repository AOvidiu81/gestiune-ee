<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f2a44">
<title>Verificare legitimație — Euro Ecologic</title>
<!-- v10.29 (cerut de Ovidiu, 26.11): pagina din codul QR = EXACT legitimatia, pe tot ecranul (culcata; in portret se roteste 90°).
     Starea apare in randul sediului: „… | ACTIV” (verde) sau „… | INACTIV” (rosu). Date din RPC verifica_legitimatie. -->
<style>
  html, body { margin: 0; height: 100%; background: #1f2a44; font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
  .rot { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); container-type: inline-size;
    width: min(calc(100vw - 16px), calc((100dvh - 16px) * 85.6 / 54)); }
  @media (orientation: portrait) { .rot { transform: translate(-50%, -50%) rotate(90deg); width: min(calc(100dvh - 16px), calc((100vw - 16px) * 85.6 / 54)); } }
  .msg { background: #eef3fa; color: #4b5874; font-weight: 700; font-size: 4cqw; text-align: center; padding: 3cqw; border-radius: 3cqw; }
  .msg.nu { background: #fde2e2; color: #9b1c1c; }
  .lg-card{aspect-ratio:85.6/54;background:#fff;color:#141A2E;border-radius:3.5cqw;overflow:hidden;display:flex;flex-direction:column;font-size:3.2cqw;box-shadow:0 8px 28px rgba(0,0,0,.35)}
  .lg-cap{display:flex;flex-wrap:wrap;align-items:center;gap:0 3cqw;padding:2.2cqw 3.5cqw 1.4cqw;border-bottom:.9cqw solid #17275A}.lg-cap img{height:7.5cqw}
  .lg-sediu{flex-basis:100%;font-size:2.4cqw;color:#4b5874;margin-top:.9cqw;padding-top:.8cqw;border-top:.2cqw solid #e3e8f0}
  .lg-sediu .ok{color:#1e8a36;font-weight:800} .lg-sediu .nu{color:#c81e1e;font-weight:800}
  .lg-titlu{font-weight:800;font-size:4.3cqw;color:#17275A;letter-spacing:.2cqw}.lg-firma{font-size:2.6cqw;color:#4b5874}
  .lg-corp{flex:1;display:flex;gap:3cqw;padding:3cqw 3.5cqw 1.5cqw;align-items:center;min-height:0}
  .lg-poza{width:21cqw;height:28cqw;object-fit:cover;border-radius:1.5cqw;border:.3cqw solid #c7d3e4;flex-shrink:0}
  .lg-poza-logo{display:flex;align-items:center;justify-content:center;background:#f3f6fb}.lg-poza-logo img{width:85%}
  .lg-date{flex:1;min-width:0;line-height:1.45}.lg-nume{font-weight:800;font-size:4.6cqw;color:#17275A;line-height:1.15;margin-bottom:.6cqw}
  .lg-fn{font-weight:700;color:#2E8B3C;margin-bottom:1cqw;text-transform:uppercase}
  .lg-qr{width:20cqw;flex-shrink:0;text-align:center;font-size:2cqw;color:#4b5874}
  /* v10.41 (cerut de Ovidiu, 27.11): după scanare nu mai apare codul QR — în locul lui ștampila verificării, cu ceasul care merge (dovadă că nu e o captură) */
  .lg-instr{display:inline-block;margin-top:1cqw;border:.3cqw solid #17275A;color:#17275A;border-radius:5cqw;padding:.6cqw .9cqw;font-weight:800;font-size:1.6cqw;white-space:nowrap;cursor:pointer;background:#fff}
  .lg-stamp{border:.6cqw solid #1e8a36;color:#1e8a36;border-radius:2cqw;padding:1.6cqw .8cqw;font-weight:800;line-height:1.25}
  .lg-stamp.nu{border-color:#c81e1e;color:#c81e1e}
  .lg-stamp .bif{font-size:7cqw;line-height:1}.lg-stamp .t{font-size:2.6cqw;letter-spacing:.15cqw}
  .lg-stamp .ora{font-size:3.4cqw;color:#141A2E;margin-top:.8cqw;font-variant-numeric:tabular-nums}.lg-stamp .zi{font-size:2cqw;color:#4b5874;font-weight:700}
  .lg-tel{display:inline-block;margin-top:1.2cqw;color:#17275A;font-weight:800;text-decoration:none;font-size:2.2cqw}
  .lg-jos{background:#17275A;color:#fff;font-size:2.4cqw;text-align:center;padding:1.3cqw 3cqw}
</style>
</head>
<body>
<div class="rot" id="rot"><div class="msg">Se verifică…</div></div>
<script>
// v10.44 (cerut de Ovidiu, 27.11): SSM / PSI / Medicina muncii — doar informativ, într-o fereastră la atingere (caietele semnate sunt în mașină)
function instrStare(iso, luni){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || "")); if(!m) return null;
  // v10.45 (cerut de Ovidiu, 27.11): instruirile periodice se fac în IANUARIE și IUNIE — o instruire (sau cea de la angajare)
  // e valabilă până la sfârșitul următoarei luni de instruire: ian.–mai → 30 iunie același an; iun.–dec. → 31 ianuarie anul următor
  let d = new Date(+m[1], +m[2] - 1, +m[3]);
  if(luni === "per"){ const l = +m[2], an = +m[1]; d = l < 6 ? new Date(an, 5, 30) : new Date(an + 1, 0, 31); }
  else if(luni) d.setMonth(d.getMonth() + luni);
  const azi = new Date(); azi.setHours(0, 0, 0, 0); const z = Math.round((d - azi) / 864e5);
  const ro = x => String(x.getDate()).padStart(2, "0") + "." + String(x.getMonth() + 1).padStart(2, "0") + "." + x.getFullYear();
  return { de: m[3] + "." + m[2] + "." + m[1], pana: ro(d), t: z < 0 ? "✕ EXPIRAT" : z <= 30 ? "⚠ EXPIRĂ ÎN " + z + (z === 1 ? " ZI" : " ZILE") : "✓ LA ZI",
    c: z < 0 ? "#c81e1e" : z <= 30 ? "#c2410c" : "#1e8a36" };
}
function instrPop(ssm, psi, med){
  const rand = (ic, titlu, s, txt) => `<div class="ip-t">
    <div class="ip-ic">${ic}</div><div class="ip-ti">${titlu}</div>
    <div class="ip-tx">${s ? txt(s) : "Nicio dată trecută"}</div>
    <div class="ip-st" style="border-color:${s ? s.c : "#9aa3b5"};color:${s ? s.c : "#7a8396"}">${s ? s.t : "—"}</div></div>`;
  const a = instrStare(ssm, "per"), b = instrStare(psi, "per"), c = instrStare(med, 0);
  const ins = s => `Ultima instruire: <b>${s.de}</b><br>valabilă până la <b>${s.pana}</b><br>(următoarea instruire)`;
  let el = document.getElementById("instr-pop"); if(el) el.remove();
  el = document.createElement("div"); el.id = "instr-pop";
  el.style.cssText = "position:fixed;inset:0;z-index:99999;background:rgba(10,15,30,.6);display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:Arial,Helvetica,sans-serif";
  // v10.46 (cerut de Ovidiu, 27.11): fereastra e culcată (landscape) ca legitimația — pe telefon ținut vertical se rotește singură 90°
  el.innerHTML = `<style>#instr-pop .ip-b{background:#fff;border-radius:18px;width:calc(100vw - 28px);max-width:860px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45);flex-shrink:0}
    @media (orientation:portrait){#instr-pop .ip-b{transform:rotate(90deg);width:calc(100dvh - 28px);max-height:calc(100vw - 24px);overflow:auto}}
    #instr-pop .ip-h{background:#17275A;color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:18px}
    #instr-pop .ip-g{display:grid;grid-template-columns:repeat(3,1fr)}
    #instr-pop .ip-t{padding:14px 14px 16px;border-right:1px solid #e6ebf3;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}#instr-pop .ip-t:last-child{border-right:0}
    #instr-pop .ip-ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#eef6f0}
    #instr-pop .ip-ti{font-weight:800;font-size:15px;color:#17275A;line-height:1.2}#instr-pop .ip-tx{font-size:13px;color:#4b5874;line-height:1.35;flex:1}
    #instr-pop .ip-st{font-weight:800;font-size:12.5px;padding:6px 10px;border-radius:20px;border:2px solid;white-space:nowrap}
    #instr-pop .ip-f{padding:9px 18px;font-size:12px;color:#6b7690;background:#f5f7fb;border-top:1px solid #e6ebf3}</style>
    <div class="ip-b"><div class="ip-h">🛡 Instruiri și medicina muncii<span data-x style="cursor:pointer;font-size:22px;opacity:.85;padding:0 4px">✕</span></div>
    <div class="ip-g">${rand("⛑️", "SSM — securitate și sănătate în muncă", a, ins)}${rand("🧯", "PSI — situații de urgență", b, ins)}${rand("🩺", "Medicina muncii", c, s => `Apt · fișa valabilă până la <b>${s.de}</b>`)}</div>
    <div class="ip-f">Informativ · fișele de instruire semnate sunt în caietele SSM / PSI din mașină</div></div>`;
  el.onclick = e => { if(e.target === el || e.target.closest("[data-x]")) el.remove(); };
  document.body.appendChild(el);
}

document.addEventListener("click", e => { const t = e.target.closest && e.target.closest(".lg-instr"); if(!t) return; e.preventDefault(); e.stopPropagation(); instrPop(t.dataset.ssm || "", t.dataset.psi || "", t.dataset.med || ""); }, true);
(async () => {
  const URL_DB = "https://xrveoxmsdvryzyemmkqx.supabase.co", CHEIE = "sb_publishable_P1TSfVqqbyr3L-elKVgopg_1FpIpkv4", LOGO = "pv/assets/logo/euro_ecologic_logo.png";
  const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const dataRo = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || "")); return m ? m[3] + "." + m[2] + "." + m[1] : "-"; };
  const vechime = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || "")); if (!m) return "";
    const d = new Date(+m[1], +m[2] - 1, +m[3]), a = new Date(); let l = (a.getFullYear() - d.getFullYear()) * 12 + a.getMonth() - d.getMonth(); if (a.getDate() < d.getDate()) l--;
    if (l < 0) return ""; const an = Math.floor(l / 12), r = l % 12;
    return [an ? an + (an === 1 ? " an" : " ani") : "", r ? r + (r === 1 ? " lună" : " luni") : ""].filter(Boolean).join(" și ") || "sub o lună"; };
  const rot = document.getElementById("rot"), cod = new URLSearchParams(location.search).get("c") || "";
  try {
    const x = await fetch(URL_DB + "/rest/v1/rpc/verifica_legitimatie", { method: "POST",
      headers: { "Content-Type": "application/json", apikey: CHEIE, Authorization: "Bearer " + CHEIE }, body: JSON.stringify({ p_cod: cod }) });
    const d = x.ok ? await x.json() : null, p = d && d[0];
    if (!p) { rot.innerHTML = '<div class="msg nu">✕ Legitimație necunoscută — codul nu corespunde niciunui angajat Euro Ecologic</div>'; return; }
    const poza = p.foto_url ? `<img class="lg-poza" src="${p.foto_url}" alt="">` : `<div class="lg-poza lg-poza-logo"><img src="${LOGO}" alt=""></div>`;
    const st = p.activ ? '<span class="ok">ACTIV</span>' : '<span class="nu">INACTIV</span>';
    const v = vechime(p.data_angajare);
    rot.innerHTML = `<div class="lg-card" title="Verificat la ${esc(new Date().toLocaleString("ro-RO"))}"><div class="lg-cap"><img src="${LOGO}" alt="Euro Ecologic"><div><div class="lg-titlu">LEGITIMAȚIE DE LUCRU</div><div class="lg-firma">${esc(p.firma || "SC EURO ECOLOGIC SRL")}${p.cui ? " · CUI " + esc(p.cui) : ""}</div></div>
      <div class="lg-sediu">${p.firma_adresa ? "Sediu: " + esc(p.firma_adresa) + " | " : ""}${st}</div></div>
      <div class="lg-corp">${poza}<div class="lg-date"><div class="lg-nume">${esc(p.full_name)}</div><div class="lg-fn">${esc(p.functie || "")}</div>
        <div>Depozit <b>${esc(p.depozit || "-")}</b></div><div>Contract nr. <b>${esc(p.nr_contract || "-")}</b></div><div>Angajat din <b>${dataRo(p.data_angajare)}</b></div>${v ? `<div>Vechime <b>${esc(v)}</b></div>` : ""}</div>
        <div class="lg-qr"><div class="lg-stamp lg-instr${p.activ ? "" : " nu"}" data-ssm="${esc(p.ssm_data || "")}" data-psi="${esc(p.psi_data || "")}" data-med="${esc(p.medicina_expira || "")}" style="cursor:pointer;display:block;border-radius:2cqw;padding:1.6cqw .8cqw;margin:0;font-size:inherit;background:none"><div class="bif">${p.activ ? "✓" : "✕"}</div><div class="t">${p.activ ? "VERIFICAT" : "NU MAI E ANGAJAT"}</div>
          <div class="ora" id="lg-ora"></div><div class="zi" id="lg-zi"></div></div>
          <div style="font-size:1.8cqw;color:#1e8a36;font-weight:700;margin-top:.8cqw">atinge ștampila pentru SSM · PSI · Medicina muncii</div></div></div>
      <div class="lg-jos">${esc([p.depozit_adresa ? "Punct de lucru: " + p.depozit_adresa : "", p.depozit_telefon ? "Tel. " + p.depozit_telefon : "", p.depozit ? "Depozit " + p.depozit : ""].filter(Boolean).join(" · "))}</div></div>`;
    const ceas = () => { const a = new Date(), o = document.getElementById("lg-ora"), z = document.getElementById("lg-zi"); if (!o) return;
      o.textContent = a.toLocaleTimeString("ro-RO", { hour: "2-digit", minute: "2-digit", second: "2-digit" }); z.textContent = a.toLocaleDateString("ro-RO", { day: "2-digit", month: "2-digit", year: "numeric" }); };
    ceas(); setInterval(ceas, 1000);
  } catch (e) { rot.innerHTML = '<div class="msg">Nu se poate verifica acum (fără internet). Încearcă din nou.</div>'; }
})();
</script>
</body>
</html>
