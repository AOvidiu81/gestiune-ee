<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f2a44">
<title>Verificare legitimație — Euro Ecologic</title>
<!-- v10.26 (cerut de Ovidiu, 26.11): pagina din codul QR arata EXACT legitimatia (pe tot ecranul, culcata) + banda ACTIV / NU mai este angajat.
     Date din RPC verifica_legitimatie (aceleasi ca pe card). In portret cardul se roteste 90°, ca sa fie cat mai mare. -->
<style>
  html, body { margin: 0; height: 100%; background: #1f2a44; font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
  .rot { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); container-type: inline-size;
    width: min(calc(100vw - 24px), calc((100dvh - 24px) / 0.8)); }
  @media (orientation: portrait) { .rot { transform: translate(-50%, -50%) rotate(90deg); width: min(calc(100dvh - 24px), calc((100vw - 16px) / 0.8)); } }
  .st { font-weight: 800; font-size: 4.6cqw; text-align: center; padding: 1.6cqw; border-radius: 2.5cqw; margin-bottom: 1.8cqw; }
  .ok { background: #d6f3dc; color: #1e6b2d; } .nu { background: #fde2e2; color: #9b1c1c; } .as { background: #eef3fa; color: #4b5874; }
  .ora { color: #c9d2e3; font-size: 2.2cqw; text-align: center; margin-top: 1.4cqw; }
  .lg-card{aspect-ratio:85.6/54;background:#fff;color:#141A2E;border-radius:3.5cqw;overflow:hidden;display:flex;flex-direction:column;font-size:3.2cqw;box-shadow:0 8px 28px rgba(0,0,0,.35)}
  .lg-cap{display:flex;align-items:center;gap:3cqw;padding:2.2cqw 3.5cqw;border-bottom:.9cqw solid #17275A}.lg-cap img{height:7.5cqw}
  .lg-titlu{font-weight:800;font-size:4.3cqw;color:#17275A;letter-spacing:.2cqw}.lg-firma{font-size:2.6cqw;color:#4b5874}
  .lg-corp{flex:1;display:flex;gap:3cqw;padding:3cqw 3.5cqw 1.5cqw;align-items:center;min-height:0}
  .lg-poza{width:21cqw;height:28cqw;object-fit:cover;border-radius:1.5cqw;border:.3cqw solid #c7d3e4;flex-shrink:0}
  .lg-poza-logo{display:flex;align-items:center;justify-content:center;background:#f3f6fb}.lg-poza-logo img{width:85%}
  .lg-date{flex:1;min-width:0;line-height:1.45}.lg-nume{font-weight:800;font-size:4.6cqw;color:#17275A;line-height:1.15;margin-bottom:.6cqw}
  .lg-fn{font-weight:700;color:#2E8B3C;margin-bottom:1cqw;text-transform:uppercase}
  .lg-verif{width:20cqw;flex-shrink:0;text-align:center;font-size:2.3cqw;font-weight:800;border-radius:2cqw;padding:2cqw 1cqw}
  .lg-verif big{display:block;font-size:9cqw;line-height:1}
  .lg-jos{background:#17275A;color:#fff;font-size:2.4cqw;text-align:center;padding:1.3cqw 3cqw}
</style>
</head>
<body>
<div class="rot" id="rot"><div class="st as">Se verifică…</div></div>
<script>
(async () => {
  const URL_DB = "https://xrveoxmsdvryzyemmkqx.supabase.co", CHEIE = "sb_publishable_P1TSfVqqbyr3L-elKVgopg_1FpIpkv4", LOGO = "pv/assets/logo/euro_ecologic_logo.png";
  const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const dataRo = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || "")); return m ? m[3] + "." + m[2] + "." + m[1] : "-"; };
  const rot = document.getElementById("rot"), cod = new URLSearchParams(location.search).get("c") || "";
  const ora = '<div class="ora">Verificat la ' + new Date().toLocaleString("ro-RO") + "</div>";
  try {
    const x = await fetch(URL_DB + "/rest/v1/rpc/verifica_legitimatie", { method: "POST",
      headers: { "Content-Type": "application/json", apikey: CHEIE, Authorization: "Bearer " + CHEIE }, body: JSON.stringify({ p_cod: cod }) });
    const d = x.ok ? await x.json() : null, p = d && d[0];
    if (!p) { rot.innerHTML = '<div class="st nu">✕ Legitimație necunoscută — codul nu corespunde niciunui angajat Euro Ecologic</div>' + ora; return; }
    const poza = p.foto_url ? `<img class="lg-poza" src="${p.foto_url}" alt="">` : `<div class="lg-poza lg-poza-logo"><img src="${LOGO}" alt=""></div>`;
    const verif = p.activ ? '<div class="lg-verif ok"><big>✔</big>ANGAJAT<br>ACTIV</div>' : '<div class="lg-verif nu"><big>✕</big>NU MAI ESTE<br>ANGAJAT</div>';
    rot.innerHTML = (p.activ ? '<div class="st ok">✔ ANGAJAT ACTIV · Euro Ecologic</div>' : '<div class="st nu">✕ NU mai este angajat Euro Ecologic</div>') +
      `<div class="lg-card"><div class="lg-cap"><img src="${LOGO}" alt="Euro Ecologic"><div><div class="lg-titlu">LEGITIMAȚIE DE LUCRU</div><div class="lg-firma">${esc(p.firma || "SC EURO ECOLOGIC SRL")}${p.cui ? " · CUI " + esc(p.cui) : ""}</div></div></div>
      <div class="lg-corp">${poza}<div class="lg-date"><div class="lg-nume">${esc(p.full_name)}</div><div class="lg-fn">${esc(p.functie || "")}</div>
        <div>Depozit <b>${esc(p.depozit || "-")}</b></div><div>Contract nr. <b>${esc(p.nr_contract || "-")}</b></div><div>Angajat din <b>${dataRo(p.data_angajare)}</b></div></div>${verif}</div>
      <div class="lg-jos">${esc([p.depozit_adresa, p.depozit_telefon].filter(Boolean).join(" · "))}</div></div>` + ora;
  } catch (e) { rot.innerHTML = '<div class="st as">Nu se poate verifica acum (fără internet). Încearcă din nou.</div>'; }
})();
</script>
</body>
</html>
