<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Date pentru contract — Euro Ecologic</title>
<link rel="icon" href="icons/icon-192.png">
<style>
  /* GestiuneEE v8.12 — fișa „Date contract” completată de client prin link (cerut de Ovidiu, 08.11).
     Vorbește doar cu funcția cerere-date; codul din link e singura cheie. */
  :root{--g:#17275A;--g2:#2F55A4;--gl:#EEF2FA;--tx:#141A2E;--mu:#5E6A82;--ln:#D7DDEA;--rd:#B4232A;--ok:#15803d;--bg:#F4F6FB}
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.4}
  header{background:var(--g);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
  header img{height:38px;filter:brightness(0) invert(1)}   /* v8.19: logo alb pe fundalul albastru (cerut de Ovidiu, 08.11) */
  header h1{font-size:18px;margin:0;font-weight:700}
  header small{display:block;font-size:12px;opacity:.85;font-weight:400}
  main{max-width:760px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:14px}
  .card h2{font-size:15px;margin:0 0 4px;color:var(--g);text-transform:uppercase;letter-spacing:.03em}
  .card p.n{margin:0 0 12px;color:var(--mu);font-size:13px}
  .rand{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .rand .tot{grid-column:1/-1}
  @media (max-width:560px){.rand{grid-template-columns:1fr}}
  label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin-bottom:4px}
  label .o{color:var(--rd)}
  input,textarea,select{width:100%;font:inherit;padding:10px 11px;border:1px solid var(--ln);border-radius:8px;background:#fff;color:var(--tx)}
  input:focus,textarea:focus{outline:2px solid var(--g2);border-color:var(--g2)}
  textarea{min-height:64px;resize:vertical}
  .gres{border-color:var(--rd)!important;background:#FFF6F6}
  .ajut{font-size:12px;color:var(--mu);margin-top:3px}
  .btn{display:inline-block;font:inherit;font-weight:700;border:0;border-radius:8px;padding:11px 18px;cursor:pointer;background:var(--g);color:#fff}
  .btn.sec{background:var(--gl);color:var(--g)}
  .btn:disabled{opacity:.55;cursor:default}
  .cu-btn{display:flex;gap:8px}.cu-btn input{flex:1}.cu-btn .btn{white-space:nowrap;padding:10px 14px}
  .msg{padding:12px 14px;border-radius:8px;margin:10px 0;font-size:14px}
  .msg.err{background:#FCECEC;color:var(--rd)}.msg.ok{background:#E8F6EE;color:var(--ok)}.msg.info{background:var(--gl);color:var(--g)}
  .semn{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px}
  @media (max-width:560px){.semn{grid-template-columns:1fr auto}.semn input:first-child{grid-column:1/-1}}
  .ci-prev{margin-top:10px;max-width:100%;max-height:260px;border:1px solid var(--ln);border-radius:8px}
  .jos{text-align:center;color:var(--mu);font-size:12px;margin:18px 0 30px}
  .trimite{width:100%;font-size:17px;padding:14px}
  .ascuns{display:none}
  .prod{display:grid;grid-template-columns:2fr 2fr 80px 1.6fr auto;gap:8px;margin-bottom:8px;align-items:end}
  .prod label{font-size:11px}
  @media (max-width:560px){.prod{grid-template-columns:1fr 1fr;padding:10px;border:1px solid var(--ln);border-radius:8px}.prod .x{grid-column:2;justify-self:end}}
  .cont{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px}
  @media (max-width:560px){.cont{grid-template-columns:1fr auto}.cont input:first-child{grid-column:1/-1}}
  .adr-gasit{font-size:12px;color:var(--ok);margin-top:3px}
</style>
</head>
<body>
<header>
  <img src="icons/logo-ee.png" alt="Euro Ecologic" onerror="this.style.display='none'">
  <div><h1>Date pentru contract<small>SC EURO-ECOLOGIC SRL · hunedoara@eurowc.ro · 0735 214 751</small></h1></div>
</header>
<main>
  <div id="stare" class="msg info">Se încarcă…</div>
  <form id="f" class="ascuns" novalidate></form>
  <div class="jos">Datele sunt folosite doar pentru redactarea contractului, conform Regulamentului UE 679/2016 (GDPR).<br>Conexiune securizată · Euro Ecologic</div>
</main>
<script>
const URL_F = "https://xrveoxmsdvryzyemmkqx.supabase.co/functions/v1/cerere-date";
const CHEIE = "sb_publishable_P1TSfVqqbyr3L-elKVgopg_1FpIpkv4";   // cheia publică a aplicației (nu dă acces la date)
const COD = new URLSearchParams(location.search).get("c") || "";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let C = null, CI = null;

async function api(o){
  const r = await fetch(URL_F, { method: "POST", headers: { "Content-Type": "application/json", apikey: CHEIE, Authorization: "Bearer " + CHEIE }, body: JSON.stringify({ c: COD, ...o }) });
  return r.json();
}
function stare(t, cls){ const s = $("stare"); s.className = "msg " + (cls || "info"); s.innerHTML = t; s.style.display = t ? "" : "none"; }

// ---------- câmpurile pe categorie ----------
const CAT = {
  SOCIETATE: { titlu: "Societate (SRL, SA…)", den: "Denumirea societății", reg: "Nr. Registrul Comerțului (J…)", cui: "CUI", sediu: "Adresa sediului social", iban: "Cont IBAN", banca: "Banca (și sucursala)", fct: "Administrator", anaf: true },
  PFA: { titlu: "PFA / Întreprindere individuală / familială", den: "Denumirea (ex. POPESCU ION PFA)", reg: "Nr. Registrul Comerțului (F… / J…)", cui: "CUI", sediu: "Sediul profesional", iban: "Cont IBAN", banca: "Banca (și sucursala)", fct: "Titular", anaf: true },
  INSTITUTIE: { titlu: "Instituție publică / Primărie", den: "Denumirea instituției (ex. COMUNA X / ORAȘUL X)", reg: null, cui: "Cod de identificare fiscală (CIF)", sediu: "Adresa sediului", iban: "Cont IBAN (Trezorerie)", banca: "Trezoreria", fct: "Primar", anaf: true },
  ONG: { titlu: "Asociație / Fundație / ONG", den: "Denumirea organizației", reg: null, inreg: "Înscrisă în Registrul Asociațiilor și Fundațiilor de pe lângă (Judecătoria / Tribunalul) … sub nr. …", cui: "Cod de identificare fiscală (CIF)", sediu: "Adresa sediului", iban: "Cont IBAN", banca: "Banca (și sucursala)", fct: "Președinte", anaf: true },
  ALTELE: { titlu: "Altă entitate", den: "Denumirea", reg: null, inreg: "Înregistrată la / în baza (act de înființare, registru, nr.)", cui: "Cod fiscal / Cod TVA", sediu: "Adresa sediului", iban: "Cont IBAN", banca: "Banca", fct: "Reprezentant", anaf: true },
  PF: { titlu: "Persoană fizică" }
};
const camp = (id, et, o) => { o = o || {};
  const v = esc((C.precompletat || {})[id] ?? o.val ?? "");
  const lab = `<label for="${id}">${esc(et)}${o.ob ? ' <span class="o">*</span>' : ""}</label>`;
  const el = o.ta ? `<textarea id="${id}" name="${id}" ${o.ob ? "data-ob" : ""}>${v}</textarea>`
    : `<input id="${id}" name="${id}" type="${o.tip || "text"}" value="${v}" ${o.ob ? "data-ob" : ""} ${o.ph ? `placeholder="${esc(o.ph)}"` : ""} ${o.extra || ""}>`;
  return `<div class="${o.tot ? "tot" : ""}">${lab}${o.btn ? o.btn : el}${o.aj ? `<div class="ajut">${esc(o.aj)}</div>` : ""}</div>`;
};
function deseneaza(){
  const k = C.categorie in CAT ? C.categorie : "SOCIETATE", d = CAT[k], P = C.precompletat || {}, ev = C.felul === "eveniment";
  let h = `<div class="card"><h2>${esc(d.titlu)}</h2><p class="n">Completați câmpurile de mai jos. Cele cu <span style="color:var(--rd)">*</span> sunt obligatorii.${d.anaf ? " Scrieți CUI-ul și apăsați „Caută la ANAF” — se completează singure denumirea, adresa și nr. de înregistrare." : ""}</p><div class="rand">`;
  if(k === "PF"){
    h += camp("nume", "Nume și prenume", { ob: 1, tot: 1 }) + camp("cnp", "CNP", { ob: 1, extra: 'inputmode="numeric" maxlength="13"' }) + camp("telefon", "Telefon", { ob: 1, tip: "tel" })
      + camp("ci_serie", "CI — seria", { ob: 1, extra: 'maxlength="3" style="text-transform:uppercase"' }) + camp("ci_numar", "CI — numărul", { ob: 1, extra: 'inputmode="numeric"' })
      + camp("ci_emis_de", "CI — emisă de", { ob: 1 }) + camp("ci_expira", "CI — valabilă până la", { ob: 1, tip: "date" })
      + camp("domiciliu", "Domiciliul (localitate, stradă, nr., județ)", { ob: 1, tot: 1, ta: 1 }) + camp("email", "E-mail", { tip: "email", tot: 1 });
    h += `</div></div><div class="card"><h2>Copia actului de identitate <span style="color:var(--rd)">*</span></h2><p class="n">Fotografiați buletinul (fața) sau încărcați o poză / un PDF. Copia se anexează la contract (Anexa CI) și validează contractul. Se păstrează doar la Euro Ecologic.</p><div>
      <input id="ci_fis" type="file" accept="image/*,application/pdf" capture="environment"><div id="ci_info" class="ajut"></div><img id="ci_prev" class="ci-prev ascuns" alt="">`;
  } else {
    h += camp("cui", d.cui, { ob: k !== "ALTELE", btn: `<div class="cu-btn"><input id="cui_v" value="${esc(P.cui || "")}" inputmode="numeric" ${k !== "ALTELE" ? "data-ob" : ""}><button type="button" class="btn sec" id="b_anaf">Caută la ANAF</button></div>` })
      + (d.reg ? camp("nr_reg", d.reg, { ob: 1 }) : "<div></div>")
      + camp("denumire", d.den, { ob: 1, tot: 1 })
      + (d.inreg ? camp("inregistrare", d.inreg, { ob: k === "ONG", tot: 1, ta: 1, ph: k === "ONG" ? "ex. Judecătoria Deva, nr. 23/2002" : "" }) : "")
      + camp("sediu", d.sediu, { ob: 1, tot: 1, ta: 1 })
      + camp("iban", d.iban, { ob: 1, ph: "RO.. ....  (dacă nu aveți acum, scrieți -)", aj: "Dacă nu îl aveți la îndemână, scrieți „-”." }) + camp("banca", d.banca, { ob: 1, aj: "Se completează singură din IBAN." });
    h += `</div></div><div class="card"><h2>Cine semnează contractul</h2><p class="n">Reprezentantul legal. Dacă la dvs. semnează și alte persoane (ex. consilier juridic, viză CFP, director economic), adăugați-le mai jos — vor apărea la semnături.</p><div class="rand">`
      + camp("reprezentant", "Nume și prenume", { ob: 1 }) + camp("functie", "Funcția", { ob: 1, val: d.fct }) + `</div>
      <div style="margin-top:12px"><label>Alți semnatari (opțional)</label><div id="semn"></div><button type="button" class="btn sec" id="b_semn">+ Adaugă semnatar</button></div>`;
    h += `</div><div class="card"><h2>Contact</h2><div class="rand">` + camp("telefon", "Telefon", { ob: 1, tip: "tel" }) + camp("email", "E-mail", { ob: 1, tip: "email" })
      + camp("email_efactura", "E-mail pentru facturi (dacă e altul)", { tip: "email", tot: 1 });
  }
  h += `</div></div><div class="card"><h2>Adresa pentru notificări</h2><p class="n">Doar dacă e alta decât ${k === "PF" ? "domiciliul" : "sediul"}.</p><div class="rand">`
    + camp("notif_adresa", "Adresa", { tot: 1, ta: 1 }) + camp("notif_atentie", "În atenția (nume)", { tot: 1 });
  h += `</div></div><div class="card"><h2>Livrare</h2><div class="rand">`
    + camp("livrare_adresa", "Adresa de livrare (județ, localitate, stradă, nr.)", { ob: 1, tot: 1, ta: 1 })
    + camp("livrare_gps", "Coordonate GPS (opțional)", { tot: 1, ph: "ex. 45.7512, 22.9034", btn: `<div class="cu-btn"><input id="livrare_gps_v" value="${esc(P.livrare_gps || "")}" placeholder="ex. 45.7512, 22.9034"><button type="button" class="btn sec" id="b_gps">📍 Locația mea</button></div>`, aj: "Dacă sunteți acum la locul livrării, apăsați „Locația mea”." })
    + camp("contact_nume", "Persoana de contact la locație", { ob: 1 }) + camp("contact_tel", "Telefonul ei", { ob: 1, tip: "tel" })
    + `<div class="tot"><div id="contacte"></div><button type="button" class="btn sec" id="b_cont">+ Adaugă încă o persoană de contact</button></div>`;
  h += `</div></div><div class="card"><h2>Comanda</h2><p class="n">Alegeți produsele. Pentru mai multe produse apăsați „+ Adaugă produs”.</p><div id="prod"></div>
    <button type="button" class="btn sec" id="b_prod" style="margin-bottom:12px">+ Adaugă produs</button><div class="rand">`
    + camp("produse_obs", "Alte detalii despre comandă (opțional)", { tot: 1, ta: 1 })
    + (ev ? camp("eveniment", "Evenimentul: zilele, orele de amplasare / ridicare, câte servisări", { ob: 1, tot: 1, ta: 1 })
          : camp("perioada_de", "De la data", { tip: "date" }) + camp("perioada_pana", "Până la data (sau scrieți mai jos câte zile / luni)", { tip: "date" }) + camp("perioada_text", "Perioada (dacă nu știți datele exacte)", { tot: 1, ph: "ex. 60 de zile / 6 luni / până la finalizarea lucrării" }))
    + camp("observatii", "Observații", { tot: 1, ta: 1 });
  h += `</div></div><div id="err" class="msg err ascuns"></div><button type="submit" class="btn trimite" id="b_trim">Trimite datele</button>`;
  $("f").innerHTML = h; $("f").classList.remove("ascuns");
  // semnatari
  (Array.isArray(P.semnatari) ? P.semnatari : []).forEach(s => adSemn(s.nume, s.functie));
  if($("b_semn")) $("b_semn").onclick = () => adSemn("", "");
  if($("b_anaf")) $("b_anaf").onclick = cautaAnaf;
  if($("b_gps")) $("b_gps").onclick = gps;
  if($("ci_fis")) $("ci_fis").onchange = alegeCi;
  if($("iban")) $("iban").addEventListener("input", () => { const b = bancaDinIban($("iban").value); if(b && !$("banca").value.trim()) $("banca").value = b; });
  $("b_cont").onclick = () => adCont("", ""); (Array.isArray(P.contacte_extra) ? P.contacte_extra : []).forEach(c => adCont(c.nume, c.telefon));
  $("b_prod").onclick = () => adProd({}); (Array.isArray(P.produse_lista) && P.produse_lista.length ? P.produse_lista : [{}]).forEach(adProd);
  $("f").onsubmit = trimite;
}
// v8.20 (cerut de Ovidiu, 08.11): banca din IBAN; mai multe persoane de contact; produsele pe rânduri (din catalog); adresa din GPS
const BANCI = { RNCB:"BCR", BRDE:"BRD", BTRL:"Banca Transilvania", RZBR:"Raiffeisen Bank", INGB:"ING Bank", CECE:"CEC Bank", TREZ:"Trezoreria Statului",
  BACX:"UniCredit Bank", PIRB:"First Bank", OTPV:"OTP Bank", BRMA:"Banca Românească", UGBI:"Garanti BBVA", LIBR:"Libra Internet Bank", CARP:"Patria Bank",
  BPOS:"Banca Comercială Feroviara", EGNA:"Exim Banca Românească", CRCO:"ProCredit Bank", INTE:"Intesa Sanpaolo", DAFB:"Alpha Bank", WBAN:"Banca Transilvania", REVO:"Revolut" };
const bancaDinIban = i => { const m = /^RO\d{2}([A-Z]{4})/.exec(String(i || "").replace(/\s+/g, "").toUpperCase()); return m ? (BANCI[m[1]] || "") : ""; };
function adCont(n, t){
  const d = document.createElement("div"); d.className = "cont";
  d.innerHTML = `<input placeholder="Nume și prenume" value="${esc(n)}"><input type="tel" placeholder="Telefon" value="${esc(t)}"><button type="button" class="btn sec" title="Scoate">✕</button>`;
  d.querySelector("button").onclick = () => d.remove(); $("contacte").appendChild(d);
}
// v8.21 (cerut de Ovidiu, 08.11): clientul alege doar 1 / săpt., 2 / săpt., 2 / lună, 1 / lună, La cerere — în ordinea asta
const FR_OK = ["1 / Sap", "2 / Sap", "2 / Luna", "1 / Luna", "La Cerere"];
const CAT_P = () => (C.catalog && C.catalog.produse) || [], FRECV = () => { const l = (C.catalog && C.catalog.frecvente) || []; return FR_OK.filter(x => l.includes(x)); };
const areFrecv = p => /TOALET/i.test(p || "");
const frTxt = x => String(x).replace(/\s*\/\s*Sap$/i, " / săptămână").replace(/\s*\/\s*Luna$/i, " / lună").replace(/^La Cerere$/i, "La cerere");
function adProd(o){
  const d = document.createElement("div"); d.className = "prod";
  const opt = (l, v, gol) => (gol ? `<option value="">${gol}</option>` : "") + l.map(x => `<option ${x === v ? "selected" : ""}>${esc(x)}</option>`).join("");
  d.innerHTML = `<div><label>Produs</label><select class="p-prod">${opt(CAT_P().map(p => p.nume), o.produs, "— alegeți —")}</select></div>
    <div class="p-tip-w"><label>Tip</label><select class="p-tip"></select></div>
    <div><label>Bucăți</label><input class="p-buc" type="number" min="1" inputmode="numeric" value="${esc(o.buc || 1)}"></div>
    <div class="p-fr-w"><label>Igienizare (curățare)</label><select class="p-fr"><option value="">— cât de des —</option>${FRECV().map(x => `<option value="${esc(x)}" ${x === o.frecventa ? "selected" : ""}>${esc(frTxt(x))}</option>`).join("")}</select></div>
    <button type="button" class="btn sec x" title="Scoate produsul">✕</button>`;
  const pr = d.querySelector(".p-prod"), tp = d.querySelector(".p-tip");
  const actual = () => { const p = CAT_P().find(x => x.nume === pr.value), t = (p && p.tipuri) || [];
    tp.innerHTML = opt(t, o.tip, t.length > 1 ? "— oricare —" : ""); d.querySelector(".p-tip-w").style.visibility = t.length ? "" : "hidden";
    d.querySelector(".p-fr-w").style.visibility = areFrecv(pr.value) ? "" : "hidden"; };
  pr.onchange = () => { o.tip = ""; actual(); }; actual();
  d.querySelector(".x").onclick = () => d.remove(); $("prod").appendChild(d);
}
function citesteProd(){
  return [...$("prod").children].map(d => ({ produs: d.querySelector(".p-prod").value, tip: d.querySelector(".p-tip").value, buc: +d.querySelector(".p-buc").value || 0,
    frecventa: areFrecv(d.querySelector(".p-prod").value) ? d.querySelector(".p-fr").value : "" })).filter(x => x.produs);
}
const textProd = l => l.map(x => x.buc + " " + x.produs + (x.tip ? " " + x.tip : "") + (x.frecventa ? " (igienizare " + x.frecventa + ")" : "")).join("; ");
async function adresaDinGps(lat, lon){
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&accept-language=ro`);
    const j = await r.json(), a = j.address || {}, P = [];
    const jud = String(a.county || a.state || "").replace(/^Jude[țt]ul\s+/i, "");
    if(jud) P.push("Jud. " + jud);
    const loc = a.city || a.town || (a.municipality ? "Com. " + a.municipality : ""), sat = a.village || a.hamlet || "";
    if(loc) P.push(loc); if(sat && sat !== (a.city || a.town || a.municipality)) P.push("Sat " + sat);
    if(a.road) P.push(a.road.replace(/^Strada\s+/i, "Str. ") + (a.house_number ? " nr. " + a.house_number : ""));
    return P.join(", ") || j.display_name || "";
  }catch(e){ return ""; }
}
function adSemn(n, f){
  const d = document.createElement("div"); d.className = "semn";
  d.innerHTML = `<input placeholder="Nume și prenume" value="${esc(n)}"><input placeholder="Funcția (ex. Consilier juridic / Vizat CFP)" value="${esc(f)}"><button type="button" class="btn sec" title="Scoate">✕</button>`;
  d.querySelector("button").onclick = () => d.remove(); $("semn").appendChild(d);
}
async function cautaAnaf(){
  const cui = $("cui_v").value.replace(/\D/g, ""); if(!cui){ $("cui_v").focus(); return; }
  const b = $("b_anaf"); b.disabled = true; b.textContent = "Caut…";
  try{
    const j = await api({ actiune: "anaf", cui });
    if(j.eroare) alert(j.eroare);
    else if(!j.gasit) alert("CUI-ul nu a fost găsit la ANAF. Completați datele de mână.");
    else {
      const pune = (id, v) => { if(v && $(id) && !$(id).value.trim()) $(id).value = v; };
      $("cui_v").value = (j.platitor_tva ? "RO " : "") + j.cui;
      pune("denumire", j.denumire); pune("sediu", j.adresa); pune("nr_reg", j.nr_reg_com); pune("iban", j.iban);
    }
  }catch(e){ alert("ANAF nu răspunde acum. Completați datele de mână."); }
  b.disabled = false; b.textContent = "Caută la ANAF";
}
function gps(){
  if(!navigator.geolocation){ alert("Telefonul nu permite locația"); return; }
  const b = $("b_gps"); b.disabled = true; b.textContent = "Caut…";
  navigator.geolocation.getCurrentPosition(async p => {
    const la = p.coords.latitude.toFixed(6), lo = p.coords.longitude.toFixed(6); $("livrare_gps_v").value = la + ", " + lo;
    const adr = await adresaDinGps(la, lo); b.disabled = false; b.textContent = "📍 Locația mea";
    if(adr){ const t = $("livrare_adresa"); if(!t.value.trim() || confirm("Am găsit adresa:\n" + adr + "\n\nO trec la „Adresa de livrare” în locul celei scrise?")) t.value = adr;
      let n = $("adr_gasit"); if(!n){ n = document.createElement("div"); n.id = "adr_gasit"; n.className = "adr-gasit"; t.parentElement.appendChild(n); }
      n.textContent = "✓ Adresa găsită după locație — verificați-o și completați ce lipsește (ex. numărul)."; } },
    () => { b.disabled = false; b.textContent = "📍 Locația mea"; alert("Nu am putut afla locația (permisiunea a fost refuzată?)"); }, { enableHighAccuracy: true, timeout: 15000 });
}
// copia CI: poza se micșorează la max. 2000 px (JPEG); PDF-ul merge cum e
async function alegeCi(){
  const f = $("ci_fis").files[0]; CI = null; $("ci_prev").classList.add("ascuns"); $("ci_info").textContent = "";
  if(!f) return;
  if(f.type === "application/pdf"){
    if(f.size > 7.5 * 1024 * 1024){ $("ci_info").textContent = "PDF-ul e prea mare (max. 7 MB)."; return; }
    CI = { tip: "application/pdf", base64: await b64(f) }; $("ci_info").textContent = "✓ PDF atașat: " + f.name; return;
  }
  try{
    const img = await new Promise((ok, nu) => { const i = new Image(); i.onload = () => ok(i); i.onerror = nu; i.src = URL.createObjectURL(f); });
    const k = Math.min(1, 2000 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
    cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    const url = cv.toDataURL("image/jpeg", 0.85); CI = { tip: "image/jpeg", base64: url.split(",")[1] };
    $("ci_prev").src = url; $("ci_prev").classList.remove("ascuns"); $("ci_info").textContent = "✓ Poză atașată. Verificați să se citească bine.";
  }catch(e){ $("ci_info").textContent = "Fișierul nu poate fi citit. Încercați o poză JPG."; }
}
const b64 = f => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.readAsDataURL(f); });
const cnpOk = c => { if(!/^\d{13}$/.test(c)) return false; const k = "279146358279"; let s = 0; for(let i = 0; i < 12; i++) s += +c[i] * +k[i]; let r = s % 11; if(r === 10) r = 1; return r === +c[12]; };
async function trimite(ev){
  ev.preventDefault();
  const R = {}, lips = [];
  $("f").querySelectorAll("input[name],textarea[name]").forEach(e => { R[e.name] = e.value.trim(); });
  if($("cui_v")) R.cui = $("cui_v").value.trim();
  if($("livrare_gps_v")) R.livrare_gps = $("livrare_gps_v").value.trim();
  if($("contacte")) R.contacte_extra = [...$("contacte").children].map(d => { const i = d.querySelectorAll("input"); return { nume: i[0].value.trim(), telefon: i[1].value.trim() }; }).filter(c => c.nume || c.telefon);
  R.produse_lista = citesteProd(); R.produse = textProd(R.produse_lista) + (R.produse_obs ? (R.produse_lista.length ? "; " : "") + R.produse_obs : "");
  if($("semn")) R.semnatari = [...$("semn").children].map(d => { const i = d.querySelectorAll("input"); return { nume: i[0].value.trim(), functie: i[1].value.trim() }; }).filter(s => s.nume || s.functie);
  if($("iban") && $("iban").value.trim() === "-" && !$("banca").value.trim()){ $("banca").value = "-"; R.banca = "-"; }   // fără IBAN → nici bancă
  $("f").querySelectorAll(".gres").forEach(e => e.classList.remove("gres"));
  $("f").querySelectorAll("[data-ob]").forEach(e => { if(!e.value.trim()){ e.classList.add("gres"); lips.push(e); } });
  const err = [];
  if(lips.length) err.push("Completați câmpurile marcate cu roșu.");
  if(!R.produse_lista.length || R.produse_lista.some(x => x.buc < 1)){ err.push("Alegeți cel puțin un produs și numărul de bucăți."); }
  else if(R.produse_lista.some(x => areFrecv(x.produs) && !x.frecventa)) err.push("Alegeți cât de des se face igienizarea la toalete.");
  if(C.categorie === "PF"){
    if(R.cnp && !cnpOk(R.cnp)){ $("cnp").classList.add("gres"); err.push("CNP-ul nu este valid."); }
    if(!CI) err.push("Atașați copia actului de identitate.");
    if(R.ci_expira && R.ci_expira < new Date().toISOString().slice(0, 10)){ $("ci_expira").classList.add("gres"); err.push("Actul de identitate este expirat."); }
  }
  if(R.iban && R.iban !== "-" && !/^RO\d{2}[A-Z]{4}[A-Z0-9]{16}$/i.test(R.iban.replace(/\s+/g, ""))){ $("iban").classList.add("gres"); err.push("IBAN-ul nu pare corect (RO + 22 de caractere)."); }
  if(err.length){ $("err").innerHTML = err.map(esc).join("<br>"); $("err").classList.remove("ascuns"); (lips[0] || $("err")).scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  $("err").classList.add("ascuns");
  const b = $("b_trim"); b.disabled = true; b.textContent = "Se trimite…";
  try{
    const j = await api({ actiune: "trimite", raspuns: R, ci: CI });
    if(j.ok){ $("f").classList.add("ascuns"); stare("<b>Mulțumim! Datele au fost trimise.</b><br>Euro Ecologic vă va trimite contractul în cel mai scurt timp.", "ok"); window.scrollTo(0, 0); return; }
    $("err").textContent = j.eroare || "Nu s-a putut trimite. Încercați din nou."; $("err").classList.remove("ascuns");
  }catch(e){ $("err").textContent = "Fără conexiune. Încercați din nou."; $("err").classList.remove("ascuns"); }
  b.disabled = false; b.textContent = "Trimite datele";
}
(async () => {
  if(!COD){ stare("Link incomplet. Folosiți linkul primit de la Euro Ecologic.", "err"); return; }

    const j = await api({ actiune: "citeste" });

  }catch(e){ stare("Nu se poate încărca formularul. Verificați conexiunea și reîncărcați pagina.", "err"); }
})();
