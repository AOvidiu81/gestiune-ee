<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Date pentru contract — Euro Ecologic</title>
<link rel="icon" href="icons/icon-192.png">
<style>
  /* GestiuneEE v8.12 — fișa „Date contract” completată de client prin link (cerut de Ovidiu, 08.11).
     Vorbește doar cu funcția cerere-date; codul din link e singura cheie. */
  :root{--g:#17275A;--g2:#2F55A4;--gl:#EEF2FA;--tx:#141A2E;--mu:#5E6A82;--ln:#D7DDEA;--rd:#B4232A;--ok:#15803d;--bg:#F4F6FB}
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.4}
  header{background:var(--g);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
  header img{height:38px;filter:brightness(0) invert(1)}   /* v8.19: logo alb pe fundalul albastru (cerut de Ovidiu, 08.11) */
  header h1{font-size:18px;margin:0;font-weight:700}
  header small{display:block;font-size:12px;opacity:.85;font-weight:400}
  main{max-width:760px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:14px}
  .card h2{font-size:15px;margin:0 0 4px;color:var(--g);text-transform:uppercase;letter-spacing:.03em}
  .card p.n{margin:0 0 12px;color:var(--mu);font-size:13px}
  .rand{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .rand .tot{grid-column:1/-1}
  @media (max-width:560px){.rand{grid-template-columns:1fr}}
  label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin-bottom:4px}
  label .o{color:var(--rd)}
  input,textarea,select{width:100%;font:inherit;padding:10px 11px;border:1px solid var(--ln);border-radius:8px;background:#fff;color:var(--tx)}
  input:focus,textarea:focus{outline:2px solid var(--g2);border-color:var(--g2)}
  textarea{min-height:64px;resize:vertical}
  .gres{border-color:var(--rd)!important;background:#FFF6F6}
  .ajut{font-size:12px;color:var(--mu);margin-top:3px}
  .btn{display:inline-block;font:inherit;font-weight:700;border:0;border-radius:8px;padding:11px 18px;cursor:pointer;background:var(--g);color:#fff}
  .btn.sec{background:var(--gl);color:var(--g)}
  .btn:disabled{opacity:.55;cursor:default}
  .cu-btn{display:flex;gap:8px}.cu-btn input{flex:1}.cu-btn .btn{white-space:nowrap;padding:10px 14px}
  .msg{padding:12px 14px;border-radius:8px;margin:10px 0;font-size:14px}
  .msg.err{background:#FCECEC;color:var(--rd)}.msg.ok{background:#E8F6EE;color:var(--ok)}.msg.info{background:var(--gl);color:var(--g)}
  .semn{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px}
  @media (max-width:560px){.semn{grid-template-columns:1fr auto}.semn input:first-child{grid-column:1/-1}}
  .ci-prev{margin-top:10px;max-width:100%;max-height:260px;border:1px solid var(--ln);border-radius:8px}
  .jos{text-align:center;color:var(--mu);font-size:12px;margin:18px 0 30px}
  .trimite{width:100%;font-size:17px;padding:14px}
  .ascuns{display:none}
  .prod{display:grid;grid-template-columns:2fr 2fr 80px 1.6fr auto;gap:8px;margin-bottom:8px;align-items:end}
  .prod label{font-size:11px}
  @media (max-width:560px){.prod{grid-template-columns:1fr 1fr;padding:10px;border:1px solid var(--ln);border-radius:8px}.prod .x{grid-column:2;justify-self:end}}
  .cont{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px}
  @media (max-width:560px){.cont{grid-template-columns:1fr auto}.cont input:first-child{grid-column:1/-1}}
  .rec{font-size:11px;font-weight:600;color:#9a6700;background:#FFF4D6;border-radius:5px;padding:1px 6px;margin-left:4px}
  .tprod{width:100%;border-collapse:collapse;font-size:14px}.tprod th,.tprod td{border:1px solid var(--ln);padding:7px 8px;text-align:left}.tprod th{background:var(--gl);color:var(--g);font-size:12px}
  .card.info{border-left:5px solid var(--g2)}.card.info ul{margin:4px 0 0;padding-left:20px}.card.info li{margin:3px 0}
  .ci-btns{display:flex;flex-wrap:wrap;gap:8px}.ci-btns .btn{padding:10px 14px}
  .ci-prevs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.ci-prevs figure{margin:0;position:relative}.ci-prevs img{max-width:220px;max-height:160px;border:1px solid var(--ln);border-radius:8px;display:block}
  .ci-prevs figcaption{font-size:12px;color:var(--mu);margin-top:2px}.ci-prevs button{position:absolute;top:4px;right:4px;border:0;border-radius:6px;background:#fff;cursor:pointer;padding:2px 7px}
  .ev-serv{display:flex;flex-wrap:wrap;gap:6px}.ev-serv label{display:flex;align-items:center;gap:5px;font-weight:600;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:7px 10px;margin:0;cursor:pointer;background:#fff}
  .ev-serv label:has(input:checked){background:var(--gl);border-color:var(--g2)}.ev-serv input{width:auto}
  .adr-gasit{font-size:12px;color:var(--ok);margin-top:3px}
</style>
</head>
<body>
<header>
  <img src="icons/logo-ee.png" alt="Euro Ecologic" onerror="this.style.display='none'">
  <div><h1>Date pentru contract<small>SC EURO-ECOLOGIC SRL · hunedoara@eurowc.ro · 0735 214 751</small></h1></div>
</header>
<main>
  <div id="stare" class="msg info">Se încarcă…</div>
  <form id="f" class="ascuns" novalidate></form>
  <div class="jos">Datele sunt folosite doar pentru redactarea contractului, conform Regulamentului UE 679/2016 (GDPR).<br>Conexiune securizată · Euro Ecologic</div>
</main>
<script>
const URL_F = "https://xrveoxmsdvryzyemmkqx.supabase.co/functions/v1/cerere-date";
const CHEIE = "sb_publishable_P1TSfVqqbyr3L-elKVgopg_1FpIpkv4";   // cheia publică a aplicației (nu dă acces la date)
const COD = new URLSearchParams(location.search).get("c") || "";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let C = null;

async function api(o){
  const r = await fetch(URL_F, { method: "POST", headers: { "Content-Type": "application/json", apikey: CHEIE, Authorization: "Bearer " + CHEIE }, body: JSON.stringify({ c: COD, ...o }) });
  return r.json();
}
function stare(t, cls){ const s = $("stare"); s.className = "msg " + (cls || "info"); s.innerHTML = t; s.style.display = t ? "" : "none"; }

// ---------- câmpurile pe categorie ----------
const CAT = {
  SOCIETATE: { titlu: "Societate (SRL, SA…)", den: "Denumirea societății", reg: "Nr. Registrul Comerțului (J…)", cui: "CUI", sediu: "Adresa sediului social", iban: "Cont IBAN", banca: "Banca (și sucursala)", fct: "Administrator", fctAj: "la societăți: administratorul", anaf: true },
  PFA: { titlu: "PFA / Întreprindere individuală / familială", den: "Denumirea (ex. POPESCU ION PFA)", reg: "Nr. Registrul Comerțului (F… / J…)", cui: "CUI", sediu: "Sediul profesional", iban: "Cont IBAN", banca: "Banca (și sucursala)", fct: "Titular", fctAj: "la PFA / II: titularul; la IF: reprezentantul familiei", anaf: true },
  INSTITUTIE: { titlu: "Instituție publică / Primărie", den: "Denumirea instituției (ex. COMUNA X / ORAȘUL X)", reg: null, cui: "Cod de identificare fiscală (CIF)", sediu: "Adresa sediului", iban: "Cont IBAN (Trezorerie)", banca: "Trezoreria", fct: "Primar", fctAj: "primarul / directorul / conducătorul instituției", anaf: true },
  ONG: { titlu: "Asociație / Fundație / ONG", den: "Denumirea organizației", reg: null, inreg: "Înscrisă în Registrul Asociațiilor și Fundațiilor de pe lângă (Judecătoria / Tribunalul) … sub nr. …", cui: "Cod de identificare fiscală (CIF)", sediu: "Adresa sediului", iban: "Cont IBAN", banca: "Banca (și sucursala)", fct: "Președinte", fctAj: "de obicei președintele", anaf: true },
  ALTELE: { titlu: "Altă entitate", den: "Denumirea", reg: null, inreg: "Înregistrată la / în baza (act de înființare, registru, nr.)", cui: "Cod fiscal / Cod TVA", sediu: "Adresa sediului", iban: "Cont IBAN", banca: "Banca", fct: "Reprezentant", fctAj: "cel care are dreptul să semneze", anaf: true },
  PF: { titlu: "Persoană fizică" }
};
const camp = (id, et, o) => { o = o || {};
  const v = esc((C.precompletat || {})[id] ?? o.val ?? "");
  const lab = `<label for="${id}">${esc(et)}${o.ob ? ' <span class="o">*</span>' : ""}${o.rec ? ' <span class="rec">recomandat</span>' : ""}</label>`;
  const el = o.ta ? `<textarea id="${id}" name="${id}" ${o.ob ? "data-ob" : ""}>${v}</textarea>`
    : `<input id="${id}" name="${id}" type="${o.tip || "text"}" value="${v}" ${o.ob ? "data-ob" : ""} ${o.ph ? `placeholder="${esc(o.ph)}"` : ""} ${o.extra || ""}>`;
  return `<div class="${o.tot ? "tot" : ""}">${lab}${o.btn ? o.btn : el}${o.aj ? `<div class="ajut">${esc(o.aj)}</div>` : ""}</div>`;
};
function deseneaza(){
  // v8.81 (cerut de Ovidiu, 15.11 — notițele din laboratorul fișei): obligatoriu doar ce trebuie; CUI opțional (cu confirmare la trimitere);
  // adresa de livrare pe căsuțe (județ, localitate, sat, stradă / reper, nr.); la eveniment zilele, servisările, amplasarea și ridicarea;
  // copia CI: poză față + verso sau din galerie (1–2 poze) sau PDF — opțională la trimitere, obligatorie pentru contract; fără igienizare la produse.
  const k = C.categorie in CAT ? C.categorie : "SOCIETATE", d = CAT[k], P = C.precompletat || {}, ev = C.felul === "eveniment";
  let h = "";
  // v8.82: condițiile / plata scrise de Euro Ecologic din ofertă (P.conditii) apar sus, alături de regulile pentru persoane fizice
  const DS = [];
  if(P.conditii) DS.push(...String(P.conditii).split(/\n+/).filter(x => x.trim()).map(x => esc(x.trim())));
  if(k === "PF") DS.push("<b>Plata facturii se face în avans.</b>", "<b>Chiria minimă este de 30 de zile.</b>", "<b>Copia actului de identitate este obligatorie pentru contract.</b> O puteți atașa acum (mai jos) sau o trimiteți ulterior.");
  if(DS.length) h += `<div class="card info"><h2>De știut</h2><ul>${DS.map(x => "<li>" + x + "</li>").join("")}</ul></div>`;
  if(k === "INSTITUTIE" && P.sicap) h += `<div class="card info"><h2>Achiziția</h2><p style="margin:0">Achiziție SICAP: <b>${esc(P.sicap)}</b></p></div>`;
  h += `<div class="card"><h2>${esc(d.titlu)}</h2><p class="n">Completați câmpurile de mai jos. Cele cu <span style="color:var(--rd)">*</span> sunt obligatorii.${d.anaf ? " Scrieți CUI-ul și apăsați „Caută la ANAF” — se completează singure denumirea, adresa și nr. de înregistrare." : ""}</p><div class="rand">`;
  if(k === "PF"){
    h += camp("nume", "Nume și prenume", { ob: 1, tot: 1 }) + camp("cnp", "CNP", { ob: 1, extra: 'inputmode="numeric" maxlength="13"' }) + camp("telefon", "Telefon", { ob: 1, tip: "tel" })
      + camp("ci_serie", "CI — seria", { ob: 1, extra: 'maxlength="3" style="text-transform:uppercase"' }) + camp("ci_numar", "CI — numărul", { ob: 1, extra: 'inputmode="numeric"' })
      + camp("ci_emis_de", "CI — emisă de", { ob: 1 }) + camp("ci_expira", "CI — valabilă până la", { ob: 1, tip: "date" })
      + camp("domiciliu", "Domiciliul (localitate, stradă, nr., județ)", { ob: 1, tot: 1, ta: 1 }) + camp("email", "E-mail", { tip: "email", tot: 1, rec: 1 });
    h += `</div></div><div class="card"><h2>Copia actului de identitate</h2><p class="n">Obligatorie pentru contract (se anexează — Anexa CI). Faceți poză la buletin (față și, dacă e cazul, verso), alegeți 1–2 poze din galerie sau un PDF. Se păstrează doar la Euro Ecologic.</p>
      <div class="ci-btns"><label class="btn sec">📷 Poză — față<input type="file" accept="image/*" capture="environment" data-p="fata" hidden></label>
        <label class="btn sec">📷 Poză — verso<input type="file" accept="image/*" capture="environment" data-p="verso" hidden></label>
        <label class="btn sec">🖼 Din galerie (1–2 poze)<input type="file" accept="image/*" multiple data-p="gal" hidden></label>
        <label class="btn sec">📄 PDF<input type="file" accept="application/pdf" data-p="pdf" hidden></label></div>
      <div id="ci_prevs" class="ci-prevs"></div><div id="ci_info" class="ajut"></div>`;
  } else {
    h += camp("cui", d.cui, { btn: `<div class="cu-btn"><input id="cui_v" value="${esc(P.cui || "")}" inputmode="numeric"><button type="button" class="btn sec" id="b_anaf">Caută la ANAF</button></div>` })
      + (d.reg ? camp("nr_reg", d.reg) : "<div></div>")
      + camp("denumire", d.den, { ob: 1, tot: 1 })
      + (d.inreg ? camp("inregistrare", d.inreg, { tot: 1, ta: 1, ph: k === "ONG" ? "ex. Judecătoria Deva, nr. 23/2002" : "" }) : "")
      + camp("sediu", d.sediu, { tot: 1, ta: 1 })
      + camp("iban", d.iban, { ph: "RO.. ....", aj: "Dacă nu îl aveți acum, lăsați gol." }) + camp("banca", d.banca, { aj: "Se completează singură din IBAN." });
    h += `</div></div><div class="card"><h2>Cine semnează contractul</h2><p class="n">Reprezentantul legal (${esc(d.fctAj)}). Dacă la dvs. semnează și alte persoane (ex. consilier juridic, viză CFP, director economic), adăugați-le mai jos — vor apărea la semnături.</p><div class="rand">`
      + camp("reprezentant", "Nume și prenume", { ob: 1 }) + camp("functie", "Funcția", { ob: 1, val: d.fct }) + `</div>
      <div style="margin-top:12px"><label>Alți semnatari (opțional)</label><div id="semn"></div><button type="button" class="btn sec" id="b_semn">+ Adaugă semnatar</button></div>`;
    h += `</div><div class="card"><h2>Contact</h2><div class="rand">` + camp("telefon", "Telefon", { ob: 1, tip: "tel" }) + camp("email", "E-mail", { tip: "email", rec: 1 })
      + camp("email_efactura", "E-mail pentru facturi (dacă e altul)", { tip: "email", tot: 1, rec: 1, aj: "Aici primiți facturile. Dacă e același e-mail, lăsați gol." });
  }
  h += `</div></div><div class="card"><h2>Adresa pentru notificări</h2><p class="n">Doar dacă e alta decât ${k === "PF" ? "domiciliul" : "sediul"}.</p><div class="rand">`
    + camp("notif_adresa", "Adresa", { tot: 1, ta: 1 }) + camp("notif_atentie", "În atenția (nume)", { tot: 1 });
  h += `</div></div><div class="card"><h2>Livrare</h2><p class="n">Dacă sunteți acum la locul livrării, apăsați „📍 Locația mea” — adresa se completează singură; verificați-o.</p><div class="rand">`
    + camp("livrare_gps", "Coordonate GPS (opțional)", { tot: 1, btn: `<div class="cu-btn"><input id="livrare_gps_v" value="${esc(P.livrare_gps || "")}" placeholder="ex. 45.7512, 22.9034"><button type="button" class="btn sec" id="b_gps">📍 Locația mea</button></div>` })
    + camp("liv_jud", "Județul", { ob: 1, btn: `<select id="liv_jud" name="liv_jud" data-ob><option value="">— alegeți —</option>${Object.entries(JUD).map(([c, n]) => `<option value="${c}" data-n="${esc(c + " – " + n)}" ${c === (P.liv_jud || "") ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>` })
    + camp("liv_loc", "Localitatea (oraș / comună)", { ob: 1, extra: 'list="dl_loc" autocomplete="off"' })
    + camp("liv_sat", "Satul (dacă e cazul)", { extra: 'list="dl_sat" autocomplete="off"' })
    + camp("liv_str", "Strada, nr. și alte informații", { ob: 1, ph: "ex. Str. Dacia nr. 12, bl. A3, sc. 2" })
    + camp("liv_reper", "Reper locație", { ph: "ex. lângă Căminul Cultural / poarta din spate" })
    + `<div class="tot ajut" id="liv_vez"></div><datalist id="dl_loc"></datalist><datalist id="dl_sat"></datalist>`
    + camp("contact_nume", "Persoana de contact la locație", { ob: 1 }) + camp("contact_tel", "Telefonul ei", { ob: 1, tip: "tel" })
    + `<div class="tot"><div id="contacte"></div><button type="button" class="btn sec" id="b_cont">+ Adaugă încă o persoană de contact</button></div>`;
  const FIX = !!(P.produse_fixe && Array.isArray(P.produse_lista) && P.produse_lista.length);
  h += (FIX ? `</div></div><div class="card"><h2>Comanda — din oferta acceptată</h2><p class="n">Produsele și prețurile stabilite cu Euro Ecologic. Dacă doriți altceva, scrieți mai jos, la „Alte detalii”.</p>
      <table class="tprod"><tr><th>Produs</th><th>Buc.</th><th>Preț (lei, fără TVA)</th>${P.produse_lista.some(x => x.frecventa) ? "<th>Servisare</th>" : ""}</tr>${P.produse_lista.map(x => `<tr><td>${esc(x.produs + (x.tip ? " " + tipEt(x.produs, x.tip) : ""))}</td><td>${esc(x.buc)}</td><td>${x.pret != null ? esc(lei(x.pret)) + " / " + (PE[x.pe] || "zi") + " / buc." : "—"}</td>${P.produse_lista.some(y => y.frecventa) ? `<td>${esc(frTxt(x.frecventa || ""))}</td>` : ""}</tr>`).join("")}</table><div class="rand" style="margin-top:12px">`
      + camp("produse_obs", "Alte detalii despre comandă (opțional)", { tot: 1, ta: 1 })
    : `</div></div><div class="card"><h2>Comanda</h2><p class="n">Alegeți produsele. Pentru mai multe produse apăsați „+ Adaugă produs”.</p><div id="prod"></div>
    <button type="button" class="btn sec" id="b_prod" style="margin-bottom:12px">+ Adaugă produs</button><div class="rand">`
    + camp("produse_obs", "Alte detalii despre comandă (opțional)", { tot: 1, ta: 1 }))
    + (ev ? "" : camp("perioada_de", "De la data", { tip: "date", ob: 1 }) + camp("perioada_pana", "Până la data (sau scrieți mai jos câte zile / luni)", { tip: "date" }) + camp("perioada_text", "Perioada (dacă nu știți datele exacte)", { tot: 1, ph: "ex. 60 de zile / 6 luni / până la finalizarea lucrării" }));
  if(ev){
    h += `</div></div><div class="card"><h2>Evenimentul</h2><div class="rand">`
      + camp("ev_de", "Prima zi a evenimentului", { tip: "date", ob: 1 }) + camp("ev_pana", "Ultima zi a evenimentului", { tip: "date", ob: 1 })
      + `<div class="tot"><label>Zilele cu servisare (curățare)</label><div id="ev_serv" class="ev-serv"><span class="ajut">Alegeți întâi prima și ultima zi.</span></div></div>`;
    h += `</div></div><div class="card"><h2>Amplasare și ridicare</h2><p class="n">Când aducem produsele și când le ridicăm. Dacă nu știți încă orele, lăsați gol.</p><div class="rand">`
      + camp("ev_amp_data", "Amplasare — ziua", { tip: "date" }) + camp("ev_amp_ora", "Amplasare — ora", { tip: "time" })
      + camp("ev_rid_data", "Ridicare — ziua", { tip: "date" }) + camp("ev_rid_ora", "Ridicare — ora", { tip: "time" });
  }
  h += `</div><div class="rand" style="margin-top:10px">` + camp("observatii", "Observații", { tot: 1, ta: 1 });
  h += `</div></div><div id="err" class="msg err ascuns"></div><button type="submit" class="btn trimite" id="b_trim">Trimite datele</button>`;
  $("f").innerHTML = h; $("f").classList.remove("ascuns");
  (Array.isArray(P.semnatari) ? P.semnatari : []).forEach(s => adSemn(s.nume, s.functie));
  if($("b_semn")) $("b_semn").onclick = () => adSemn("", "");
  if($("b_anaf")) $("b_anaf").onclick = cautaAnaf;
  if($("b_gps")) $("b_gps").onclick = gps;
  $("f").querySelectorAll(".ci-btns input[type=file]").forEach(i => i.onchange = () => alegeCi(i));
  if($("iban")) $("iban").addEventListener("input", () => { const b = bancaDinIban($("iban").value); if(b && !$("banca").value.trim()) $("banca").value = b; });
  $("b_cont").onclick = () => adCont("", ""); (Array.isArray(P.contacte_extra) ? P.contacte_extra : []).forEach(c => adCont(c.nume, c.telefon));
  if($("b_prod")){ $("b_prod").onclick = () => adProd({}); (Array.isArray(P.produse_lista) && P.produse_lista.length ? P.produse_lista : [{}]).forEach(adProd); }
  ["liv_jud", "liv_loc", "liv_sat", "liv_str", "liv_reper"].forEach(i => $(i).addEventListener("input", livActual));
  $("liv_jud").addEventListener("change", livActual); livActual();
  // v9.78 (cerut de Ovidiu, 20.11): județul se vede prescurtat (HD); în lista deschisă apare „HD – Hunedoara”, ca să-l găsească ușor
  const jA = full => [...$("liv_jud").options].forEach(o => { if(o.value) o.textContent = full ? o.dataset.n : o.value; });
